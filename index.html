<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roughneck Inc · Wildcat CEO</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b1812'/%3E%3Cpath d='M8 21a8 8 0 0 1 16 0z' fill='%23d8b65a'/%3E%3Crect x='5' y='20' width='22' height='4' rx='2' fill='%23b58a2f'/%3E%3Crect x='14' y='9' width='4' height='7' fill='%23d8b65a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=IM+Fell+English:ital@0;1&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Special+Elite&display=swap" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/scenes.css" />
</head>
<body>
  <header id="topbar"></header>
  <div id="ticker"></div>
  <main id="stage" data-screen="title">
    <canvas id="overworld" hidden></canvas>
    <div id="screen"></div>
    <aside id="drawer">
      <div class="drawer-head"><span class="drawer-title">FILES</span><button class="small" data-action="drawer" title="Put the folder away (Esc)">Put away ✕</button></div>
      <nav id="tabs"></nav>
      <div id="panel"></div>
    </aside>
    <button id="drawer-handle" data-action="drawer" title="Open the files">FILES</button>
    <div id="hints"></div>
    <button id="prompt" data-action="interact" hidden></button>
    <div id="dpad" aria-label="Walk">
      <span></span><button data-key="ArrowUp" aria-label="Up">▲</button><span></span>
      <button data-key="ArrowLeft" aria-label="Left">◀</button><button data-action="interact" aria-label="Enter or talk">●</button><button data-key="ArrowRight" aria-label="Right">▶</button>
      <span></span><button data-key="ArrowDown" aria-label="Down">▼</button><span></span>
    </div>
  </main>
  <footer id="news"></footer>
  <div id="dialogue" hidden></div>
  <div id="modal" hidden></div>
  <div id="toast" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
